[package]
name = "hec22-cli"
version = "0.1.0"
edition = "2021"
authors = ["HEC-22 Contributors"]
description = "CLI binaries for the hec22 drainage analysis crate"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
hec22 = { path = "../../", features = ["csv", "timestamps", "visualization"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "hec22"
path = "src/main.rs"

[[bin]]
name = "atlas14_fetch"
path = "src/bin/atlas14_fetch.rs"
